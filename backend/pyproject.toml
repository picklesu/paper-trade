[project]
name = "paper-trade-backend"
version = "0.1.0"
description = "Paper trading simulator backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
paper-trade = "paper_trade.main:run"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paper_trade"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
